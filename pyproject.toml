[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-trustcheck"
version = "0.1.0"
description = "Conformance and hygiene checks for Streamable HTTP MCP servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["mcp", "model-context-protocol", "conformance", "testing"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-trustcheck = "mcp_trustcheck.cli:main"
mcp-trustcheck-mock = "mcp_trustcheck.mock_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
